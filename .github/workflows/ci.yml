name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22"
          - "24"
        opencode-plugin-version:
          - "1.18.3"
          - "1.18.4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install package dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Select OpenCode contract version
        run: npm install --ignore-scripts --no-audit --no-fund --no-save @opencode-ai/plugin@${{ matrix.opencode-plugin-version }}

      - name: Unit tests
        run: npm test

      - name: Syntax checks
        run: npm run check

      - name: Packed artifact smoke
        run: npm run pack:check

      - name: Package dry run
        run: npm pack --dry-run --json --ignore-scripts

  packed-tui-compatibility:
    name: Packed TUI OpenCode floor/latest and OpenTUI 0.4/0.5
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install package dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test aligned packed TUI consumers
        run: npm run test:tui-matrix
